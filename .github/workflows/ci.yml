name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
      
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-playwright fastapi uvicorn httpx
        playwright install --with-deps

    - name: Run Backend Server In Background
      run: |
        cd backend
        uvicorn src.main:app &
        sleep 3

    - name: Run Backend Pytest
      run: |
        cd backend
        python -m pytest test/

    - name: Run Frontend Pytest
      run: |
        cd frontend
        python -m pytest test_gui.py
  
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps: 
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} 
        aws-region: eu-north-1
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and push Docker image to ECR
      env: 
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: hex-calculator
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
    
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      env: 
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      with:
        host: ${{ secrets.EC2_HOST }} 
        username: ${{ secrets.EC2_USERNAME }} 
        key: ${{ secrets.EC2_SSH_KEY }}
        envs: ECR_REGISTRY
        script: |
          aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
          docker pull $ECR_REGISTRY/hex-calculator:latest
          docker stop hex-calc || true
          docker rm hex-calc || true
          docker run -p 80:8000 --name hex-calc $ECR_REGISTRY/hex-calculator:latest